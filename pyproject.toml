[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # Allow FastAPI Depends() and Query() in function argument defaults
    "UP046",  # Allow Generic[T] for backward-compatible typing
    "UP017",  # Allow datetime.timezone.utc for runtime compatibility
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
