# Render Blueprint specification for ThreatLens v3 Backend
# Contract Version: 3.0.0
# Single Source of Truth: docs/ARCHITECTURE_API_CONTRACT.md, Section 21

services:
  - type: web
    name: threatlens-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase pooled Postgres URL with ?sslmode=require
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard: Exact frontend URL e.g. ["https://threatlens.vercel.app"]
      - key: APPLE_COUNTRY
        value: in
      - key: CACHE_TTL_SECONDS
        value: 3600
      - key: SCAN_TIMEOUT_SECONDS
        value: 90
